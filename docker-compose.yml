#######################################
# WUD
# Conteneur chargé de mettre à jour automatiquement les autres conteneurs
# Plus d'info : https://getwud.github.io/wud/#/
services:
  abes-wud:
    image: getwud/wud:${ABES_WUD_VERSION}
    container_name: abes-wud
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${ABES_WUD_PORT}:3000
    environment:
      # ########### COMMON ###########
      TZ: "Europe/Paris"
      WUD_LOG_LEVEL: ${ABES_WUD_LOG_LEVEL}
      WUD_SERVER_FEATURE_DELETE: false

      # ########### REGISTRY ###########
      WUD_REGISTRY_HUB_PUBLIC_LOGIN: ${ABES_WUD_DOCKERHUB_USER}
      WUD_REGISTRY_HUB_PUBLIC_PASSWORD: ${ABES_WUD_DOCKERHUB_PASS}

      # ########### LOCALHOST ###########
      WUD_WATCHER_LOCAL_CRON: ${ABES_WUD_CRON}
      WUD_WATCHER_LOCAL_WATCHALL: false
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: false

      # ########### TRIGGER DOCKER UPDATE ###########
      WUD_TRIGGER_DOCKER_UPGRADE_PRUNE: true

      # ########### TRIGGER SLACK ###########
      WUD_TRIGGER_SLACK_NOTIF_TOKEN: ${ABES_WUD_SLACK_TOKEN}
      WUD_TRIGGER_SLACK_NOTIF_CHANNEL: ${ABES_WUD_SLACK_CHANNEL}
      WUD_TRIGGER_SLACK_NOTIF_SIMPLETITLE: ${ABES_WUD_SLACK_TITLE}
      WUD_TRIGGER_SLACK_NOTIF_SIMPLEBODY: ${ABES_WUD_SLACK_BODY}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    labels:
      - "wud.watch=true"
      - "wud.trigger.exclude=docker.update,slack.notif"
